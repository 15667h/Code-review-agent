<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b3d36" />
    <meta name="description" content="登录 Margin，继续你的代码审查工作台。" />
    <title>登录 · Margin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />

    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/auth.css" />
  </head>

  <body class="auth-body">
    <main class="auth">
      <!-- ================= 左：样张台 ================= -->
      <aside class="auth__aside">
        <div class="auth__brand">
          <svg
            class="brand__mark"
            width="21"
            height="21"
            viewBox="0 0 22 22"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M4.2 2.6v16.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
            <path d="M9.4 6.4h9.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
            <path d="M9.4 11h6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
            <path d="M9.4 15.6h7.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
          </svg>
          <span class="auth__brand-name">Margin</span>
        </div>

        <div class="auth__pitch">
          <p class="auth__pitch-text">把一次审查摊开来看：每一处改动为什么被标记，都能点回去看。</p>

          <figure class="specimen">
            <span class="specimen__lane" aria-hidden="true"></span>
            <div class="specimen__body">
              <div class="specimen__head">
                <span class="specimen__sev">阻断</span>
                <span class="specimen__loc" translate="no">src/middleware/rate-limit.ts:47</span>
              </div>
              <p class="specimen__title">异常路径不归还 Redis 连接，连接池会被逐步耗尽</p>
              <p class="specimen__meta">200 QPS × 90s 复现 · p99 41ms → 3,020ms</p>
            </div>
          </figure>
        </div>

        <p class="auth__foot">演示环境 · 全部为示例数据，不会发起真实请求</p>
      </aside>

      <!-- ================= 右：表单 ================= -->
      <section class="auth__panel">
        <form class="auth__form" data-auth-form="login" novalidate>
          <header class="auth__head">
            <h1 class="auth__title">登录</h1>
            <p class="auth__sub">用工作邮箱继续。演示环境里任意邮箱加 8 位以上密码即可进入。</p>
          </header>

          <p class="form-note form-note--error" data-form-note role="alert" hidden></p>

          <div class="auth__fields">
            <div class="field" data-field="email">
              <label class="field__label" for="email">邮箱</label>
              <div class="input-wrap">
                <input
                  class="input"
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  spellcheck="false"
                  placeholder="you@company.com"
                  aria-describedby="email-error"
                />
              </div>
              <p class="field__error" id="email-error" hidden></p>
            </div>

            <div class="field" data-field="password">
              <div class="field__row">
                <label class="field__label" for="password">密码</label>
                <button class="field__link" type="button" data-forgot>忘记密码？</button>
              </div>
              <div class="input-wrap input-wrap--action">
                <input
                  class="input"
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="至少 8 位"
                  aria-describedby="password-error"
                />
                <button
                  class="input-action"
                  type="button"
                  data-toggle-password="password"
                  aria-pressed="false"
                  aria-label="显示密码"
                >
                  <svg width="17" height="17" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
                    <path
                      d="M2 9s2.6-4.4 7-4.4S16 9 16 9s-2.6 4.4-7 4.4S2 9 2 9z"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.4"
                    />
                    <circle cx="9" cy="9" r="1.9" fill="none" stroke="currentColor" stroke-width="1.4" />
                  </svg>
                </button>
              </div>
              <p class="field__error" id="password-error" hidden></p>
            </div>
          </div>

          <label class="check">
            <input type="checkbox" data-remember />
            <span>记住邮箱，下次自动填好</span>
          </label>

          <button class="btn-primary" type="submit" data-submit>
            <span data-submit-label>登录</span>
          </button>

          <div class="auth__divider">或</div>

          <div class="oauth">
            <button class="oauth__btn" type="button" data-demo-enter>
              <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path
                  d="M8 1.4a6.6 6.6 0 0 0-2.09 12.86c.33.06.45-.14.45-.32v-1.13c-1.83.4-2.22-.88-2.22-.88-.3-.76-.73-.97-.73-.97-.6-.41.05-.4.05-.4.66.05 1 .68 1 .68.59 1 .01 1.55.63 1.55 1.05-.03 1.34-.67 1.36-1.37-.13-.55.62-.62.63-.62.03.35.63.2.63.35 0 .55-.1.62-.62.62v1.13c0 .18.12.38.46.32A6.6 6.6 0 0 0 8 1.4z"
                  fill="currentColor"
                />
              </svg>
              GitHub
            </button>
            <button class="oauth__btn" type="button" data-demo-enter>
              <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path
                  d="M14.2 8.2c0-.46-.04-.9-.12-1.33H8v2.52h3.47a2.97 2.97 0 0 1-1.29 1.95v1.62h2.09c1.22-1.13 1.93-2.78 1.93-4.76z"
                  fill="currentColor"
                />
                <path
                  d="M8 14.6c1.74 0 3.2-.58 4.27-1.57l-2.09-1.62c-.58.39-1.32.62-2.18.62-1.68 0-3.1-1.13-3.61-2.65H2.23v1.67A6.45 6.45 0 0 0 8 14.6z"
                  fill="currentColor"
                  opacity="0.75"
                />
                <path
                  d="M4.39 9.38a3.87 3.87 0 0 1 0-2.47V5.24H2.23a6.46 6.46 0 0 0 0 5.81l2.16-1.67z"
                  fill="currentColor"
                  opacity="0.55"
                />
                <path
                  d="M8 4.06c.95 0 1.8.33 2.47.97l1.85-1.85A6.42 6.42 0 0 0 8 1.4 6.45 6.45 0 0 0 2.23 5.24l2.16 1.67C4.9 5.2 6.32 4.06 8 4.06z"
                  fill="currentColor"
                  opacity="0.85"
                />
              </svg>
              Google
            </button>
          </div>

          <p class="auth__switch">还没有账号？<a href="register.html">创建账号</a></p>
        </form>
      </section>
    </main>

    <script src="scripts/auth.js"></script>
  </body>
</html>
