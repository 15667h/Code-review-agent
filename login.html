<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 内联图标：不声明的话浏览器会去请求 /favicon.ico，每次开页面留一条 404 -->
    <link
      rel="icon"
      href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="3.5" fill="%230f6b5c"/><path d="M4.4 11.6V4.4l3.6 4.4 3.6-4.4v7.2" fill="none" stroke="%23ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    />
    <meta name="theme-color" content="#080b0c" />
    <meta name="description" content="登录 Margin，继续你的代码审查工作台。" />
    <title>登录 · Margin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/auth.css" />
  </head>

  <body class="auth-body">
    <main class="auth">
      <!-- ================= 左：样张台 ================= -->
      <aside class="auth__aside">
        <div class="auth__brand">
          <svg
            class="brand__mark"
            width="21"
            height="21"
            viewBox="0 0 22 22"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M4.2 2.6v16.8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
            <path d="M9.4 6.4h9.2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
            <path d="M9.4 11h6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
            <path d="M9.4 15.6h7.6" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" />
          </svg>
          <span class="auth__brand-name">Margin</span>
        </div>

        <div class="auth__pitch">
          <p class="auth__pitch-text">把一次审查摊开来看：每一处改动为什么被标记，都能点回去看。</p>

          <figure class="specimen">
            <span class="specimen__lane" aria-hidden="true"></span>
            <div class="specimen__body">
              <div class="specimen__head">
                <span class="specimen__sev">阻断</span>
                <span class="specimen__loc" translate="no">src/middleware/rate-limit.ts:47</span>
              </div>
              <p class="specimen__title">异常路径不归还 Redis 连接，连接池会被逐步耗尽</p>
              <p class="specimen__meta">200 QPS × 90s 复现 · p99 41ms → 3,020ms</p>
            </div>
          </figure>
        </div>

        <p class="auth__foot">账号只存在本机 backend/.auth/，密码以 scrypt 哈希保存</p>
      </aside>

      <!-- ================= 右：表单 ================= -->
      <section class="auth__panel">
        <form class="auth__form" data-auth-form="login" novalidate>
          <header class="auth__head">
            <h1 class="auth__title">登录</h1>
            <p class="auth__sub">用工作邮箱继续。首次使用可点下方的测试账号一键登录。</p>
          </header>

          <p class="form-note form-note--error" data-form-note role="alert" hidden></p>

          <!-- 账户与密码由 auth.js 从 DEMO_CREDENTIALS 渲染：显示的内容与
               实际能登录的密码同源，避免「提示里写一个、后端存另一个」。 -->
          <p class="form-note form-note--hint" data-demo-hint hidden></p>

          <div class="auth__fields">
            <div class="field" data-field="email">
              <label class="field__label" for="email">邮箱</label>
              <div class="input-wrap">
                <input
                  class="input"
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  spellcheck="false"
                  placeholder="you@company.com"
                  aria-describedby="email-error"
                />
              </div>
              <p class="field__error" id="email-error" hidden></p>
            </div>

            <div class="field" data-field="password">
              <div class="field__row">
                <label class="field__label" for="password">密码</label>
                <button class="field__link" type="button" data-forgot>忘记密码？</button>
              </div>
              <div class="input-wrap input-wrap--action">
                <input
                  class="input"
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="至少 8 位"
                  aria-describedby="password-error"
                />
                <button
                  class="input-action"
                  type="button"
                  data-toggle-password="password"
                  aria-pressed="false"
                  aria-label="显示密码"
                >
                  <svg width="17" height="17" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
                    <path
                      d="M2 9s2.6-4.4 7-4.4S16 9 16 9s-2.6 4.4-7 4.4S2 9 2 9z"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.4"
                    />
                    <circle cx="9" cy="9" r="1.9" fill="none" stroke="currentColor" stroke-width="1.4" />
                  </svg>
                </button>
              </div>
              <p class="field__error" id="password-error" hidden></p>
            </div>
          </div>

          <label class="check">
            <input type="checkbox" data-remember />
            <span>记住邮箱，下次自动填好</span>
          </label>

          <button class="btn-primary" type="submit" data-submit>
            <span data-submit-label>登录</span>
          </button>

          <div class="auth__divider">或</div>

          <div class="oauth">
            <button class="oauth__btn" type="button" data-demo-enter="demo@margin.dev">
              <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path
                  d="M9.5 1.4a5.1 5.1 0 0 0-4.83 6.75L1.4 11.42V14.6h3.18l.62-.62v-1.55h1.55l1.24-1.24a5.1 5.1 0 1 0 1.51-9.79zm1.6 4.2a1.15 1.15 0 1 1 0-2.3 1.15 1.15 0 0 1 0 2.3z"
                  fill="currentColor"
                />
              </svg>
              测试账号 · demo
            </button>
            <button class="oauth__btn" type="button" data-demo-enter="reviewer@margin.dev">
              <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path
                  d="M9.5 1.4a5.1 5.1 0 0 0-4.83 6.75L1.4 11.42V14.6h3.18l.62-.62v-1.55h1.55l1.24-1.24a5.1 5.1 0 1 0 1.51-9.79zm1.6 4.2a1.15 1.15 0 1 1 0-2.3 1.15 1.15 0 0 1 0 2.3z"
                  fill="currentColor"
                />
              </svg>
              测试账号 · reviewer
            </button>
          </div>

          <p class="auth__switch">还没有账号？<a href="register.html">创建账号</a></p>
        </form>
      </section>
    </main>

    <script src="scripts/api.js"></script>
    <script src="scripts/auth.js"></script>
  </body>
</html>
