[project]
name = "margin-harness"
version = "0.1.0"
description = "自研代码审计 Harness：Model + 上下文管理 + 工具接口 + 约束 / 验证 / 纠正"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
audit = "harness.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
