<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- 内联图标：不声明的话浏览器会去请求 /favicon.ico，每次开页面留一条 404 -->
    <link
      rel="icon"
      href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="3.5" fill="%230f6b5c"/><path d="M4.4 11.6V4.4l3.6 4.4 3.6-4.4v7.2" fill="none" stroke="%23ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    />
    <meta name="theme-color" content="#080b0c" />
    <meta
      name="description"
      content="Margin 是一个工作台，多个研发辅助 Agent：按空间组织仓库，运行可追溯的助手计划，产出形态由助手自己声明。"
    />
    <title>Margin · 研发助手工作台</title>

    <!-- 主题在首帧之前决定，避免深色页面闪一下白再变黑。
         令牌默认是深色（:root），data-theme="light" 才覆盖。 -->
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem('margin.theme');
          document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/app.css" />
    <link rel="stylesheet" href="styles/views.css" />
  </head>

  <body>
    <a class="skip-link" href="#conversation">跳到审查对话</a>

    <div class="shell" id="shell">
      <!-- ===================== 最左：助手轨道 =====================
           56px。助手是身份级概念：能不能一眼看见，决定「可插拔」是否成立。
           内容由 scripts/agents.js 按后端 /api/agents 渲染。 -->
      <nav class="tray" id="agentTray" aria-label="助手"></nav>

      <!-- ===================== 左侧：空间栏 ===================== -->
      <aside class="rail" id="rail" aria-label="空间与审查记录">
        <div class="rail__head">
          <button class="rail__new" type="button" id="newReview">
            <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                d="M8 3.2v9.6M3.2 8h9.6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
            <span>新建审查</span>
          </button>
        </div>

        <nav class="rail__scroll" aria-label="空间列表">
          <div class="rail__group" id="spacesGroup">
            <h2 class="rail__group-title">
              空间
              <span class="rail__count num" id="spaceCount">0</span>
            </h2>
            <ul class="space-list" id="spaceList"></ul>
          </div>
        </nav>

        <div class="rail__nav">
          <a class="rail-link" href="settings.html">
            <svg
              class="rail-link__icon"
              width="16"
              height="16"
              viewBox="0 0 16 16"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M2.6 4.6h10.8M2.6 8h10.8M2.6 11.4h10.8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
              />
              <circle cx="6" cy="4.6" r="1.8" fill="none" stroke="currentColor" stroke-width="1.3" />
              <circle cx="10.4" cy="11.4" r="1.8" fill="none" stroke="currentColor" stroke-width="1.3" />
            </svg>
            <span class="rail-link__text">
              <span class="rail-link__title">模型配置</span>
              <span class="rail-link__meta" id="railModelName" translate="no">DeepSeek V4.1 Flash</span>
            </span>
            <svg
              class="rail-link__chev"
              width="12"
              height="12"
              viewBox="0 0 12 12"
              aria-hidden="true"
              focusable="false"
            >
              <path
                d="M4.5 3 8 6l-3.5 3"
                fill="none"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </a>
        </div>

        <div class="rail__foot">
          <!-- 账号信息由 /api/auth/me 填充；未登录时 runAuth 会换成登录入口。
               这里不放静态默认值 —— 显示一个假用户名比留空更糟。 -->
          <span class="avatar" aria-hidden="true" id="railAvatar"></span>
          <span class="rail__user">
            <a class="rail__user-name" id="railUserName" href="login.html">未登录</a>
            <span class="rail__user-note" id="railUserNote"></span>
          </span>
          <button class="icon-btn icon-btn--sm" type="button" aria-label="退出登录" id="signOut" hidden>
            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                d="M6.4 2.6H4a1.6 1.6 0 0 0-1.6 1.6v7.6A1.6 1.6 0 0 0 4 13.4h2.4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.35"
                stroke-linecap="round"
              />
              <path
                d="M10.4 5.4 13 8l-2.6 2.6M13 8H6.8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.35"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
      </aside>

      <!-- ===================== 主区 ===================== -->
      <div class="stage" id="stage">
        <header class="topbar">
          <div class="context" role="group" aria-label="当前审查上下文">
            <button
              class="rail-toggle"
              type="button"
              id="railToggle"
              aria-label="收起空间栏"
              aria-expanded="true"
              aria-controls="rail"
            >
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <rect
                  x="1.7"
                  y="2.7"
                  width="12.6"
                  height="10.6"
                  rx="2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.3"
                />
                <path d="M6.4 2.7v10.6" fill="none" stroke="currentColor" stroke-width="1.3" />
              </svg>
            </button>

            <span class="context__agent" id="wsAgent" translate="no" hidden></span>

            <span class="context__divider" aria-hidden="true"></span>

            <span class="context__repo" id="wsRepo" translate="no"></span>
            <span class="context__pr" id="wsPr" translate="no" hidden></span>
          </div>

          <div class="topbar__right">
            <button
              class="icon-btn"
              type="button"
              id="themeBtn"
              aria-label="切换明暗主题"
              aria-pressed="false"
              title="切换明暗主题"
            >
              <svg
                id="themeIcon"
                width="16"
                height="16"
                viewBox="0 0 16 16"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8Z"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>

            <!-- 连接状态由 scripts/live.js 写入。初始 hidden 且不带任何
                 假状态：后端没探通之前，界面不该先声称自己连上了。 -->
            <span class="conn" id="conn" data-state="pending" hidden>
              <span class="conn__dot" aria-hidden="true"></span>
              <span class="conn__text" id="connText"></span>
            </span>

            <div class="context__meta" id="wsMeta">
              <span class="tag" translate="no" id="wsBranch" hidden>
                <svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
                  <path
                    d="M3 2.5v5.2M9 2.5v2.1c0 1-.8 1.8-1.8 1.8H4.8"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.3"
                    stroke-linecap="round"
                  />
                  <circle cx="3" cy="9.4" r="1.4" fill="currentColor" />
                  <circle cx="9" cy="2.4" r="1.4" fill="currentColor" />
                </svg>
              </span>
              <span class="meta-dot" aria-hidden="true"></span>
              <span class="meta num" id="wsFiles" hidden></span>
              <span class="meta num stat-add" id="wsAdd" hidden></span>
              <span class="meta num stat-del" id="wsDel" hidden></span>
            </div>

            <div class="brand">
              <svg
                class="brand__mark"
                width="21"
                height="21"
                viewBox="0 0 22 22"
                aria-hidden="true"
                focusable="false"
              >
                <path
                  d="M4.2 2.6v16.8"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.9"
                  stroke-linecap="round"
                />
                <path
                  d="M9.4 6.4h9.2"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.9"
                  stroke-linecap="round"
                />
                <path
                  d="M9.4 11h6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.9"
                  stroke-linecap="round"
                />
                <path
                  d="M9.4 15.6h7.6"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.9"
                  stroke-linecap="round"
                />
              </svg>
              <span class="brand__name">Margin</span>
            </div>
          </div>
        </header>

        <main class="conversation" id="conversation" tabindex="-1">
          <div class="conversation__scroll" id="scroller">
            <div class="thread" id="thread"></div>
          </div>
        </main>

        <div class="dock">
          <form class="composer" id="composer" autocomplete="off">
            <label class="sr-only" for="prompt">审查指令</label>
            <div class="composer__context">
              <span class="composer__target" id="composerTarget" hidden></span>
            </div>

            <div class="composer__box">
              <div class="composer__chips" id="scopeChips" hidden></div>

              <textarea
                id="prompt"
                class="composer__input"
                name="prompt"
                rows="1"
                placeholder="描述审查重点，或直接回车开始全量审查…"
                spellcheck="false"
                autocomplete="off"
              ></textarea>

              <div class="composer__row">
                <div class="composer__tools">
                  <div class="pop-host">
                    <button
                      class="icon-btn"
                      type="button"
                      id="attachBtn"
                      aria-label="添加仓库到工作区"
                      aria-haspopup="dialog"
                      aria-expanded="false"
                    >
                      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                        <path
                          d="M8.6 3.4 4.3 7.7a2.6 2.6 0 0 0 3.7 3.7l4.6-4.6a3.9 3.9 0 0 0-5.5-5.5L2.5 6.9"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="1.4"
                          stroke-linecap="round"
                        />
                      </svg>
                    </button>
                  </div>

                  <div class="pop-host">
                    <button
                      class="icon-btn"
                      type="button"
                      id="scopeBtn"
                      aria-label="限定本次审查的文件范围"
                      aria-haspopup="dialog"
                      aria-expanded="false"
                    >
                      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                        <path
                          d="M2.5 3.5h11M4.5 8h7M6.5 12.5h3"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="1.4"
                          stroke-linecap="round"
                        />
                      </svg>
                    </button>
                  </div>

                  <!-- 增量审查：只有声明了 capabilities.diff 的助手才显示。
                       默认隐藏，避免给架构助手一个「审 diff」的假承诺。 -->
                  <button
                    class="pop__chip"
                    type="button"
                    id="diffBtn"
                    aria-pressed="false"
                    title="只审 BASE 到工作树的改动"
                    hidden
                  >
                    增量
                  </button>
                </div>

                <div class="composer__submit">
                  <div class="model-select">
                    <button
                      class="model-btn"
                      type="button"
                      id="modelBtn"
                      aria-haspopup="listbox"
                      aria-expanded="false"
                      hidden
                    >
                      <svg
                        class="model-btn__mark"
                        width="17"
                        height="17"
                        viewBox="0 0 20 20"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <path
                          d="M2.4 12.1c0-3.4 2.8-6.2 6.2-6.2 2.6 0 4.8 1.6 5.7 3.9l2.6-1c.5-.2 1 .2.9.7l-.5 2.5c-.1.5-.5.8-1 .8h-2.1c-1 2.2-3.2 3.7-5.8 3.7-1.8 0-3.4-.7-4.6-1.9"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="1.5"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                        <circle cx="7.5" cy="10.5" r="1" fill="currentColor" />
                      </svg>
                      <span class="model-btn__name" id="modelBtnName"></span>
                      <svg
                        class="model-btn__chev"
                        width="11"
                        height="11"
                        viewBox="0 0 12 12"
                        aria-hidden="true"
                        focusable="false"
                      >
                        <path
                          d="M3 4.75 6 7.75l3-3"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="1.4"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </button>
                    <div class="model-menu" id="modelMenu" role="listbox" aria-label="选择模型" hidden></div>
                  </div>

                  <button class="stop-btn" type="button" id="stopBtn" hidden>停止</button>
                  <button class="send-btn" type="submit" id="sendBtn">
                    <span id="sendLabel">开始审查</span>
                    <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">
                      <path
                        d="M3 8h9.2M8.6 4.2 12.4 8l-3.8 3.8"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- 快捷键提示与「这句话说了什么」是两个可独立取舍的部分：
                 极窄屏只留后者，所以按键那半句必须整块包起来 ——
                 单独藏 <kbd> 会在行里留下一个孤零零的「+」。 -->
            <p class="composer__hint" id="composerHint">
              <span class="composer__keys">
                <kbd>Enter</kbd> 发送 · <kbd translate="no">Shift</kbd> + <kbd translate="no">Enter</kbd> 换行 ·
              </span>
              <span id="composerHintText">发现均为静态分析结果，合并前请人工确认</span>
            </p>

            <!-- 两个浮层挂在整个输入坞上，而不是各自的按钮里：
                 挂在按钮里会正好压在输入框与范围 chip 上，把刚勾的信息挡住。 -->
            <div
              class="pop pop--wide"
              id="attachPop"
              role="dialog"
              aria-label="添加到工作区"
              hidden
            ></div>
            <div
              class="pop pop--wide"
              id="scopePop"
              role="dialog"
              aria-label="选择审查范围"
              hidden
            ></div>
          </form>
        </div>
      </div>

      <!-- 窄屏抽屉遮罩 -->
      <div class="scrim" id="scrim" hidden></div>
    </div>

    <!-- mock-data.js 已移除：界面不再有演示数据。
         后端不可达时，app.js 会渲染一个「未连接」面板说明怎么起服务。 -->
    <script src="scripts/api.js"></script>
    <script src="scripts/agents.js"></script>
    <script src="scripts/blueprint.js"></script>
    <script src="scripts/live.js"></script>
    <script src="scripts/app.js"></script>
  </body>
</html>
